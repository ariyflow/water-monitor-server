<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>水质监测数据管理</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
</head>
<body>
  <header class="topbar">
    <h1>水质监测数据管理</h1>
    <span class="sub">Water Monitor Server</span>
    <span class="topbar-spacer"></span>
    <span class="topbar-user">{% if user %}{{ user.username }}{% endif %}</span>
    {% if user and user.is_admin %}
    <a href="{{ url_for('admin.admin_page') }}" class="btn btn-outline">管理后台</a>
    {% endif %}
    <button id="btn-logout" class="btn btn-outline">退出登录</button>
  </header>

  <main class="container">
    <section class="toolbar">
      <button id="btn-refresh" class="btn btn-primary">刷新</button>
      <button id="btn-add" class="btn btn-success">新增记录</button>
      <span id="total" class="muted">共 0 条记录</span>
    </section>

    <section class="card">
      <table class="table" id="sensor-table">
        <thead>
          <tr>
            <th>ID</th>
            <th>设备序列号</th>
            <th>pH</th>
            <th>温度 (°C)</th>
            <th>水流量</th>
            <th>浊度</th>
            <th>电导率</th>
            <th>时间戳</th>
            <th>操作</th>
          </tr>
        </thead>
        <tbody id="tbody">
          <tr><td colspan="9" class="empty">加载中...</td></tr>
        </tbody>
      </table>
    </section>
  </main>

  <div id="modal" class="modal hidden">
    <div class="modal-box">
      <h2 id="modal-title">新增记录</h2>
      <form id="modal-form">
        <label>设备序列号 *
          <input type="text" name="serial" required placeholder="如 ab12cd34ef56" />
        </label>
        <label>pH
          <input type="text" name="ph" placeholder="如 7" />
        </label>
        <label>温度 (°C)
          <input type="text" name="temperature" placeholder="如 25" />
        </label>
        <label>水流量
          <input type="text" name="flow" placeholder="如 10" />
        </label>
        <label>浊度
          <input type="text" name="turbidity" placeholder="如 10" />
        </label>
        <label>电导率
          <input type="text" name="conductivity" placeholder="如 100" />
        </label>
        <div class="modal-actions">
          <button type="button" id="btn-cancel" class="btn">取消</button>
          <button type="submit" id="btn-save" class="btn btn-primary">保存</button>
        </div>
      </form>
    </div>
  </div>

  <div id="settings-modal" class="modal hidden">
    <div class="modal-box">
      <h2 id="settings-title">阈值设置</h2>
      <form id="settings-form">
        <label>温度下限 (°C，≤当前值报警)
          <input type="number" step="any" name="temp_low_c" placeholder="0" />
        </label>
        <label>温度上限 (°C，>当前值报警)
          <input type="number" step="any" name="temp_high_c" placeholder="50" />
        </label>
        <label>水流量上限 (L/min)
          <input type="number" step="any" name="flow_high_lpm" placeholder="300" />
        </label>
        <label>电导率上限 (μS/cm)
          <input type="number" step="any" name="ec_high_us_cm" placeholder="500" />
        </label>
        <label>浊度上限 (NTU)
          <input type="number" step="any" name="turb_high_ntu" placeholder="40" />
        </label>
        <div class="modal-actions">
          <button type="button" id="btn-settings-cancel" class="btn">取消</button>
          <button type="submit" id="btn-settings-save" class="btn btn-primary">保存</button>
        </div>
      </form>
    </div>
  </div>

  <div id="toast" class="toast hidden"></div>

  <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
