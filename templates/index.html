<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>水质监测数据管理</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <style>
    /* ===== 滑块开关（展示模式切换） ===== */
    .slider-container {
      display: flex;
      align-items: center;
      gap: 1rem;
      flex-wrap: wrap;
    }
    .slider-label {
      font-size: 0.85rem;
      font-weight: 500;
      color: var(--text-secondary);
      letter-spacing: 0.3px;
      display: flex;
      align-items: center;
      gap: 0.3rem;
      white-space: nowrap;
    }
    .slider-label svg {
      width: 18px;
      height: 18px;
      stroke: currentColor;
      stroke-width: 1.8;
      fill: none;
    }
    .slider-switch {
      position: relative;
      width: 126px;
      height: 42px;
      background: rgba(255, 255, 255, 0.82);
      border-radius: 999px;
      border: 1px solid rgba(74, 124, 247, 0.22);
      cursor: pointer;
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow:
        inset 0 2px 6px rgba(0, 0, 0, 0.06),
        0 4px 12px rgba(74, 124, 247, 0.08);
      flex-shrink: 0;
    }
    .slider-switch .slider-thumb {
      position: absolute;
      top: 3px;
      left: 3px;
      width: 36px;
      height: 36px;
      background: linear-gradient(135deg, #4a7cf7, #7c6cf0);
      border-radius: 999px;
      transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
      box-shadow:
        0 4px 12px rgba(74, 124, 247, 0.25),
        inset 0 1px 0 rgba(255, 255, 255, 0.35);
      z-index: 3;
    }
    .slider-switch.chart .slider-thumb { transform: translateX(81px); }
    .slider-switch .slider-text {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.5px;
      transition: color 0.25s, opacity 0.25s;
      pointer-events: none;
      z-index: 2;
      color: rgba(74, 124, 247, 0.85);
      text-shadow: 0 0 0.5px rgba(74, 124, 247, 0.1);
    }
    .slider-switch .slider-text.left { left: 14px; }
    .slider-switch .slider-text.right { right: 14px; }
    .slider-switch.chart .slider-text.right { color: #ffffff; }
    .slider-switch:not(.chart) .slider-text.left { color: #ffffff; }
    .slider-switch.chart .slider-text.left { color: rgba(74, 124, 247, 0.55); }
    .slider-switch:not(.chart) .slider-text.right { color: rgba(74, 124, 247, 0.55); }
    .slider-switch:hover {
      border-color: rgba(74, 124, 247, 0.35);
      box-shadow:
        inset 0 2px 6px rgba(0, 0, 0, 0.06),
        0 6px 16px rgba(74, 124, 247, 0.14);
    }
    .slider-switch:active .slider-thumb { width: 40px; }

    /* ===== 控制栏 ===== */
    .control-bar {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }
    .control-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 1.5rem;
    }
    .control-row .spacer { flex: 1; }
    .control-row .custom-select { min-width: 150px; }

    /* ===== 图表容器 ===== */
    .chart-container {
      position: relative;
      height: 380px;
      width: 100%;
      margin-top: 0.3rem;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 16px;
      padding: 0.8rem 0.6rem;
      backdrop-filter: blur(4px);
    }
    #chart-info {
      color: var(--text-secondary);
      font-size: 0.9rem;
    }

    /* ===== 阈值设置特有样式 ===== */
    #settings-modal .modal-box { width: 480px; max-width: 94vw; }
    .settings-head {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin-bottom: 1.2rem;
      flex-wrap: wrap;
    }
    .settings-head h2 { margin: 0; font-size: 1.15rem; }
    .settings-dev {
      color: #5b6472;
      background: #f0f3f7;
      padding: 0.15rem 0.6rem;
      border-radius: 999px;
      font-size: 0.78rem;
      max-width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .field-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.95rem;
    }
    .field.full { grid-column: 1 / -1; }
    .field label {
      display: block;
      font-size: 0.82rem;
      color: var(--text-secondary);
      margin-bottom: 0.35rem;
    }
    .field .input-wrap {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      border: 1px solid rgba(74, 124, 247, 0.08);
      border-radius: 60px;
      padding: 0.5rem 0.7rem;
      background: rgba(255, 255, 255, 0.7);
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    .field .input-wrap:focus-within {
      border-color: var(--primary);
      box-shadow: 0 0 0 4px rgba(74, 124, 247, 0.04);
    }
    .field input {
      border: none;
      outline: none;
      width: 100%;
      min-width: 0;
      padding: 0.15rem 0;
      font-size: 0.92rem;
      background: transparent;
    }
    .field .unit {
      color: var(--text-muted);
      font-size: 0.78rem;
      white-space: nowrap;
    }
    .field .hint {
      margin: 0.32rem 0 0;
      font-size: 0.74rem;
      color: var(--text-muted);
    }

    /* ===== 工具栏 ===== */
    .toolbar {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin-bottom: 1rem;
      flex-wrap: wrap;
    }
    .toolbar .spacer { flex: 1; }
    .toolbar .muted { font-size: 0.85rem; }
    .device-info {
      font-size: 1rem;
      font-weight: 600;
      color: var(--text-primary);
      white-space: nowrap;
    }

    @media (max-width: 768px) {
      .control-row { flex-direction: column; align-items: stretch; }
      .control-row .custom-select { min-width: unset; }
      .slider-switch {
        width: 110px;
        height: 38px;
      }
      .slider-switch .slider-thumb {
        width: 32px;
        height: 32px;
      }
      .slider-switch.chart .slider-thumb { transform: translateX(75px); }
      .slider-switch .slider-text { font-size: 0.7rem; }
      .slider-switch .slider-text.left { left: 10px; }
      .slider-switch .slider-text.right { right: 10px; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <a href="#" class="topbar-brand">
      <svg viewBox="0 0 24 24" fill="none" stroke="url(#brandGrad)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <defs><linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#4a7cf7" /><stop offset="100%" stop-color="#7c6cf0" /></linearGradient></defs>
        <path d="M12 2C12 2 5 10 5 15a7 7 0 0 0 14 0c0-5-7-13-7-13z" />
        <circle cx="12" cy="15" r="2" fill="#4a7cf7" stroke="none" />
      </svg>
      <h1>水质监测</h1>
    </a>
    <span class="topbar-sub">数据总览</span>
    <span class="topbar-spacer"></span>
    <span class="topbar-user">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" /><circle cx="12" cy="7" r="4" /></svg>
      {% if user %}{{ user.username }}{% endif %}
    </span>
    <div class="btn-group">
      {% if user and user.is_admin %}
      <a href="{{ url_for('admin.admin_page') }}" class="btn btn-outline">管理后台</a>
      {% endif %}
      <button id="btn-logout" class="btn btn-outline">退出登录</button>
    </div>
  </header>

  <main class="container">
    <!-- 设备选择 + 阈值按钮 -->
    <section class="card">
      <div style="display:flex; flex-wrap:wrap; align-items:center; gap:1.5rem;">
        <div style="flex:1; min-width:240px;">
          <label style="display:block; font-size:0.85rem; font-weight:500; color:var(--text-secondary); margin-bottom:0.4rem;">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="width:18px;height:18px;vertical-align:middle;"><rect x="2" y="4" width="20" height="16" rx="2" /><line x1="8" y1="10" x2="16" y2="10" /></svg>
            设备
          </label>
          <div class="custom-select" data-select-id="sel-device">
            <select id="sel-device" class="hidden"><option value="">请选择设备</option></select>
            <div class="dropdown-trigger" tabindex="0">
              <span class="selected-text">请选择设备</span>
              <span class="arrow">▾</span>
            </div>
          </div>
        </div>
        <div class="device-info" id="device-info">请选择设备</div>
        <button id="btn-settings" class="btn btn-primary" disabled>阈值设置</button>
      </div>
    </section>

    <!-- ===== 控制栏（展示模式、指标、时间范围） ===== -->
    <section class="card">
      <div class="control-bar">
        <!-- 第一行：展示模式 + 指标 -->
        <div class="control-row">
          <div class="slider-container">
            <span class="slider-label">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="20" height="20" rx="2" /><line x1="8" y1="2" x2="8" y2="22" /><line x1="16" y1="2" x2="16" y2="22" /></svg>
              展示模式
            </span>
            <div class="slider-switch chart" id="mode-slider">
              <span class="slider-text left">列表</span>
              <span class="slider-text right">图表</span>
              <div class="slider-thumb"></div>
            </div>
          </div>
          <span class="spacer"></span>
          <span class="slider-label">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18" /><path d="M18 7v10" /><path d="M14 10v7" /><path d="M10 13v4" /><path d="M6 15v2" /></svg>
            显示指标
          </span>
          <div class="toggle-group" id="metric-selector">
            <button class="toggle-btn active" data-value="ph"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10" /><path d="M12 8v8" /><path d="M8 12h8" /></svg>pH</button>
            <button class="toggle-btn active" data-value="temperature"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 14.76V3.5a2.5 2.5 0 0 0-5 0v11.26a4.5 4.5 0 1 0 5 0z" /><circle cx="11.5" cy="18.5" r="1.5" /></svg>温度</button>
            <button class="toggle-btn active" data-value="flow"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 12 10 8 14 12 18 8" /><line x1="6" y1="16" x2="18" y2="16" /></svg>流量</button>
            <button class="toggle-btn active" data-value="turbidity"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10" /><path d="M12 2v20" /><path d="M2 12h20" /></svg>浊度</button>
            <button class="toggle-btn active" data-value="conductivity"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 20L18 4" /><path d="M6 4L18 20" /></svg>电导率</button>
          </div>
        </div>
        <!-- 第二行：时间范围 + 刷新 -->
        <div class="control-row">
          <span class="slider-label">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10" /><polyline points="12 6 12 12 16 14" /></svg>
            时间范围
          </span>
          <div class="custom-select" data-select-id="time-range">
            <select id="time-range" class="hidden">
              <option value="24">最近1d</option>
              <option value="72">最近3d</option>
              <option value="168" selected>最近7d</option>
              <option value="336">最近14d</option>
              <option value="720">最近30d</option>
            </select>
            <div class="dropdown-trigger" tabindex="0">
              <span class="selected-text">最近7d</span>
              <span class="arrow">▾</span>
            </div>
          </div>
          <span class="spacer"></span>
          <button id="btn-refresh" class="btn btn-primary">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10" /><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10" /></svg>刷新
          </button>
        </div>
      </div>
    </section>

    <!-- ===== 数据展示（列表 / 图表） ===== -->
    <section class="card" id="data-card">
      <!-- 列表视图 -->
      <div id="list-view">
        <div class="table-wrap">
          <table class="table" id="sensor-table">
            <thead>
              <tr>
                <th>ID</th>
                <th>设备序列号</th>
                <th>pH</th>
                <th>温度 (°C)</th>
                <th>水流量</th>
                <th>浊度</th>
                <th>电导率</th>
                <th>时间戳</th>
              </tr>
            </thead>
            <tbody id="tbody">
              <tr><td colspan="8" class="empty">请选择设备</td></tr>
            </tbody>
          </table>
        </div>
        <div class="pager">
          <button id="btn-prev" class="btn" disabled>◀ 上一页</button>
          <span id="page-info" class="muted">第 0 / 0 页</span>
          <button id="btn-next" class="btn" disabled>下一页 ▶</button>
          <span class="muted">跳至</span>
          <input type="number" id="page-input" min="1" value="1" disabled />
          <button id="btn-goto" class="btn" disabled>跳转</button>
        </div>
      </div>
      <!-- 图表视图 -->
      <div id="chart-view" class="hidden">
        <div class="chart-container"><canvas id="sensorChart"></canvas></div>
        <div style="text-align:right;margin-top:0.6rem;"><span class="muted" id="chart-info">选择设备后显示折线图</span></div>
      </div>
    </section>
  </main>

  <!-- 阈值设置弹窗 -->
  <div id="settings-modal" class="modal hidden">
    <div class="modal-box">
      <div class="settings-head">
        <h2>阈值设置</h2>
        <span id="settings-title" class="settings-dev">—</span>
      </div>
      <form id="settings-form">
        <div class="field-grid">
          <div class="field">
            <label for="temp_low_c">温度下限</label>
            <div class="input-wrap">
              <input type="number" step="any" id="temp_low_c" name="temp_low_c" placeholder="0.0" />
              <span class="unit">℃</span>
            </div>
            <p class="hint">≤ 当前值报警</p>
          </div>
          <div class="field">
            <label for="temp_high_c">温度上限</label>
            <div class="input-wrap">
              <input type="number" step="any" id="temp_high_c" name="temp_high_c" placeholder="50.0" />
              <span class="unit">℃</span>
            </div>
            <p class="hint">&gt; 当前值报警</p>
          </div>
          <div class="field">
            <label for="flow_high_lpm">水流量上限</label>
            <div class="input-wrap">
              <input type="number" step="any" id="flow_high_lpm" name="flow_high_lpm" placeholder="300" />
              <span class="unit">L/min</span>
            </div>
            <p class="hint">超过此值报警</p>
          </div>
          <div class="field">
            <label for="ec_high_us_cm">电导率上限</label>
            <div class="input-wrap">
              <input type="number" step="any" id="ec_high_us_cm" name="ec_high_us_cm" placeholder="500" />
              <span class="unit">μS/cm</span>
            </div>
          </div>
          <div class="field full">
            <label for="turb_high_ntu">浊度上限</label>
            <div class="input-wrap">
              <input type="number" step="any" id="turb_high_ntu" name="turb_high_ntu" placeholder="40" />
              <span class="unit">NTU</span>
            </div>
          </div>
          <div class="field">
            <label for="ph_low">PH 下限</label>
            <div class="input-wrap">
              <input type="number" step="any" id="ph_low" name="ph_low" placeholder="4.0" />
              <span class="unit">pH</span>
            </div>
            <p class="hint">≤ 当前值报警</p>
          </div>
          <div class="field">
            <label for="ph_high">PH 上限</label>
            <div class="input-wrap">
              <input type="number" step="any" id="ph_high" name="ph_high" placeholder="10.0" />
              <span class="unit">pH</span>
            </div>
            <p class="hint">&gt; 当前值报警</p>
          </div>
        </div>
        <div class="modal-actions">
          <button type="button" id="btn-settings-cancel" class="btn">取消</button>
          <button type="submit" id="btn-settings-save" class="btn btn-primary">保存</button>
        </div>
      </form>
    </div>
  </div>

  <div id="toast" class="toast hidden"></div>

  <!-- 公共 JS + 应用 JS -->
  <script src="{{ url_for('static', filename='js/common.js') }}"></script>
  <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
